<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .node { fill: #4a7ca5; }
    .node-accent { fill: #6a9ec4; }
    .edge { stroke: #c44b2b; stroke-width: 1.5; fill: none; opacity: 0.6; }
    .edge-blue { stroke: #4a7ca5; stroke-width: 1; fill: none; opacity: 0.4; }
    @keyframes nodePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes flowDot {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .node { animation: nodePulse 2s ease-in-out infinite; }
    .node:nth-child(odd) { animation-delay: 0.3s; }
    .node:nth-child(even) { animation-delay: 0.8s; }
    .flow-edge {
      stroke: #c44b2b;
      stroke-width: 2;
      fill: none;
      opacity: 0.8;
      stroke-dasharray: 4 36;
      stroke-dashoffset: 40;
      animation: flowDot 4s linear infinite;
    }
    .flow-edge:nth-of-type(2) { animation-delay: 1s; }
    .flow-edge:nth-of-type(3) { animation-delay: 2s; }
    .flow-edge:nth-of-type(4) { animation-delay: 3s; }
  </style>

  <!-- N shape — left vertical stroke -->
  <line class="edge" x1="50" y1="40" x2="50" y2="160"/>
  <line class="flow-edge" x1="50" y1="40" x2="50" y2="160"/>

  <!-- N shape — diagonal -->
  <line class="edge" x1="50" y1="40" x2="150" y2="160"/>
  <line class="flow-edge" x1="50" y1="40" x2="150" y2="160"/>

  <!-- N shape — right vertical stroke -->
  <line class="edge" x1="150" y1="40" x2="150" y2="160"/>
  <line class="flow-edge" x1="150" y1="40" x2="150" y2="160"/>

  <!-- V shape (overlapping) — left diagonal -->
  <line class="edge-blue" x1="65" y1="50" x2="100" y2="155"/>

  <!-- V shape — right diagonal -->
  <line class="edge-blue" x1="135" y1="50" x2="100" y2="155"/>

  <!-- Cross connections (network effect) -->
  <line class="edge-blue" x1="50" y1="100" x2="100" y2="70"/>
  <line class="edge-blue" x1="100" y1="70" x2="150" y2="100"/>
  <line class="edge-blue" x1="50" y1="70" x2="100" y2="100"/>
  <line class="edge-blue" x1="100" y1="100" x2="150" y2="70"/>
  <line class="edge-blue" x1="75" y1="130" x2="125" y2="130"/>

  <!-- Nodes — N shape -->
  <circle class="node" cx="50" cy="40" r="5"/>
  <circle class="node" cx="50" cy="70" r="4"/>
  <circle class="node" cx="50" cy="100" r="5"/>
  <circle class="node" cx="50" cy="130" r="4"/>
  <circle class="node" cx="50" cy="160" r="5"/>

  <circle class="node" cx="150" cy="40" r="5"/>
  <circle class="node" cx="150" cy="70" r="4"/>
  <circle class="node" cx="150" cy="100" r="5"/>
  <circle class="node" cx="150" cy="130" r="4"/>
  <circle class="node" cx="150" cy="160" r="5"/>

  <!-- Nodes — diagonal and cross points -->
  <circle class="node-accent" cx="75" cy="70" r="3.5"/>
  <circle class="node-accent" cx="100" cy="100" r="5"/>
  <circle class="node-accent" cx="125" cy="130" r="3.5"/>
  <circle class="node-accent" cx="100" cy="70" r="4"/>
  <circle class="node-accent" cx="75" cy="130" r="3.5"/>
  <circle class="node-accent" cx="100" cy="155" r="4"/>
</svg>
